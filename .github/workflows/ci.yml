name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  tests:
    name: Regression tests
    runs-on: macos-latest
    env:
      PDFIUM_PATH: ${{ github.workspace }}/build/macos/Build/Products/Debug/pdfrx/pdfrx.framework/pdfrx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release notes extraction
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build native PDFium framework
        run: flutter build macos --debug --no-pub

      - name: Require native PDFium framework
        shell: bash
        run: |
          if [[ ! -f "$PDFIUM_PATH" || ! -r "$PDFIUM_PATH" ]]; then
            echo "::error::Native PDFium framework is missing or unreadable: $PDFIUM_PATH"
            exit 1
          fi

      - name: Run app, EPUB, and PDF regression tests
        run: flutter test --no-pub test packages/epub_engine/test packages/pdf_engine/test
