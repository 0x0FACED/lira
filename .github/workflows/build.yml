name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

jobs:
  verify:
    name: Reader regressions
    uses: ./.github/workflows/ci.yml

  build-android:
    name: Build Android (${{ matrix.package }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' && '["apk"]' || '["apk","appbundle"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_android_signing.py

      - name: Build Android package
        env:
          PACKAGE: ${{ matrix.package }}
        run: flutter build "$PACKAGE" --"$BUILD_TYPE" --no-pub

      - name: Remove signing files
        if: always()
        run: rm -f android/ci-release-key.jks android/key.properties

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package == 'apk' && 'android-apk' || 'android-aab' }}
          path: ${{ matrix.package == 'apk' && format('build/app/outputs/flutter-apk/app-{0}.apk', env.BUILD_TYPE) || 'build/app/outputs/bundle/release/app-release.aab' }}
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --"$BUILD_TYPE" --no-pub

      - name: Create archive
        working-directory: build/linux/x64/${{ env.BUILD_TYPE }}/bundle
        run: zip -r "$GITHUB_WORKSPACE/lira-linux.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: lira-linux.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --$env:BUILD_TYPE --no-pub

      - name: Create archive
        run: |
          $configuration = if ($env:BUILD_TYPE -eq 'debug') { 'Debug' } else { 'Release' }
          Compress-Archive -Path "build/windows/x64/runner/$configuration/*" -DestinationPath lira-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: lira-windows.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --"$BUILD_TYPE" --no-pub

      - name: Create DMG
        run: |
          configuration=Release
          if [ "$BUILD_TYPE" = debug ]; then configuration=Debug; fi
          mkdir -p "$RUNNER_TEMP/lira-dmg"
          cp -R "build/macos/Build/Products/$configuration/lira.app" "$RUNNER_TEMP/lira-dmg/"
          ln -s /Applications "$RUNNER_TEMP/lira-dmg/Applications"
          hdiutil create -fs HFS+ -volname Lira -srcfolder "$RUNNER_TEMP/lira-dmg" Lira.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Lira.dmg
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --"$BUILD_TYPE" --no-codesign --no-pub

      - name: Prepare IPA payload
        run: |
          mkdir -p "$RUNNER_TEMP/lira-ios/Payload"
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/lira-ios/Payload/Runner.app"

      - name: Create unsigned IPA
        working-directory: ${{ runner.temp }}/lira-ios
        run: ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/lira-ios-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: lira-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/extract_release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## Установка

          iOS: IPA не подписан. Перед установкой подпишите его через AltStore, Sideloadly или другой инструмент.
          macOS: DMG без Developer ID и notarization; возможны ограничения Gatekeeper.
          EOF

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Name release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release-artifacts
        run: |
          mv app-release.apk "lira-android-$RELEASE_TAG.apk"
          mv app-release.aab "lira-android-$RELEASE_TAG.aab"
          mv lira-linux.zip "lira-linux-$RELEASE_TAG.zip"
          mv lira-windows.zip "lira-windows-$RELEASE_TAG.zip"
          mv Lira.dmg "lira-macos-$RELEASE_TAG.dmg"
          mv lira-ios-unsigned.ipa "lira-ios-$RELEASE_TAG.ipa"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/lira-android-${{ github.ref_name }}.apk
            release-artifacts/lira-android-${{ github.ref_name }}.aab
            release-artifacts/lira-linux-${{ github.ref_name }}.zip
            release-artifacts/lira-windows-${{ github.ref_name }}.zip
            release-artifacts/lira-macos-${{ github.ref_name }}.dmg
            release-artifacts/lira-ios-${{ github.ref_name }}.ipa
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
