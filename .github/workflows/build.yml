name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

jobs:
  verify:
    name: Reader regressions
    uses: ./.github/workflows/ci.yml

  build-android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_android_signing.py

      - name: Build APK
        run: flutter build apk --"$BUILD_TYPE" --no-pub

      - name: Build App Bundle
        if: env.BUILD_TYPE == 'release'
        run: flutter build appbundle --release --no-pub

      - name: Remove signing files
        if: always()
        run: rm -f android/ci-release-key.jks android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --"$BUILD_TYPE" --no-pub

      - name: Create archive
        working-directory: build/linux/x64/${{ env.BUILD_TYPE }}/bundle
        run: zip -r "$GITHUB_WORKSPACE/lira-linux.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: lira-linux.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --$env:BUILD_TYPE --no-pub

      - name: Create archive
        run: |
          $configuration = if ($env:BUILD_TYPE -eq 'debug') { 'Debug' } else { 'Release' }
          Compress-Archive -Path "build/windows/x64/runner/$configuration/*" -DestinationPath lira-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: lira-windows.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --"$BUILD_TYPE" --no-pub

      - name: Create DMG
        run: |
          configuration=Release
          if [ "$BUILD_TYPE" = debug ]; then configuration=Debug; fi
          mkdir -p "$RUNNER_TEMP/lira-dmg"
          cp -R "build/macos/Build/Products/$configuration/lira.app" "$RUNNER_TEMP/lira-dmg/"
          ln -s /Applications "$RUNNER_TEMP/lira-dmg/Applications"
          hdiutil create -fs HFS+ -volname Lira -srcfolder "$RUNNER_TEMP/lira-dmg" Lira.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Lira.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
            release-artifacts/lira-linux.zip
            release-artifacts/lira-windows.zip
            release-artifacts/Lira.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
