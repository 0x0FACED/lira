name: lira
description: "Lira is your free feature-rich library"
publish_to: 'none'

version: 0.6.5+9

environment:
  sdk: ^3.9.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  path_provider: ^2.1.5
  get_it: ^9.2.1
  # Откатываемся на стабильный стек, чтобы не ловить конфликты SDK
  flutter_riverpod: ^2.6.1 
  riverpod_annotation: ^2.3.6
  injectable: ^2.7.1
  dio: ^5.9.2
  retrofit: 4.9.2
  intl: ^0.20.2 # Стабильная версия для текущих SDK
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  epub_engine:
    path: packages/epub_engine
  pdf_engine:
    path: packages/pdf_engine
  
  # БД
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.3
  file_selector: ^1.1.0
  file_selector_linux: ^0.9.4
  file_selector_android: ^0.5.2+4
  file_selector_ios: ^0.5.3+4
  file_selector_macos: ^0.9.5
  file_selector_windows: ^0.9.3+5
  shared_preferences: ^2.3.4
  annas_archive_api: ^1.1.0
  scrollable_positioned_list: ^0.3.8
  zlibrary_api:
    path: packages/zlibrary_api
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  socks5_proxy: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  source_gen: 4.2.0
  # Генераторы (оставляем стабильные)
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  injectable_generator: ^2.6.1
  retrofit_generator: 10.2.3
  # Иконки приложения (версия 0.9.3 без конфликта image)
  flutter_launcher_icons: ^0.9.3
  # Линтеры временно удалены из-за конфликта (analyzer_plugin)

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Literata-OFL.txt
    - assets/fonts/SourceSerif4-OFL.txt
    - assets/fonts/PTSerif-OFL.txt
    - assets/fonts/NotoSerif-OFL.txt
    - assets/fonts/Merriweather-OFL.txt
    - assets/fonts/RobotoSlab-LICENSE.txt
    - assets/fonts/PTSans-OFL.txt
    - assets/fonts/NotoSans-OFL.txt
    - assets/fonts/Roboto-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
        - asset: assets/fonts/Lora-Italic-Variable.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
        - asset: assets/fonts/SourceSerif4-Italic-Variable.ttf
          style: italic
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PTSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-Variable.ttf
        - asset: assets/fonts/NotoSerif-Italic-Variable.ttf
          style: italic
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Variable.ttf
        - asset: assets/fonts/Merriweather-Italic-Variable.ttf
          style: italic
    - family: Roboto Slab
      fonts:
        - asset: assets/fonts/RobotoSlab-Variable.ttf
    - family: PT Sans
      fonts:
        - asset: assets/fonts/PTSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PTSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PTSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
        - asset: assets/fonts/NotoSans-Italic-Variable.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
        - asset: assets/fonts/Roboto-Italic-Variable.ttf
          style: italic

# Flutter Launcher Icons configuration
# Run: flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Adaptive icon for Android 8.0+ (optional)
  # adaptive_icon_background: "#000000"
  # adaptive_icon_foreground: "assets/icon/icon_foreground.png"
