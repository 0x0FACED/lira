name: lira
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  path_provider: ^2.1.5
  get_it: ^9.2.1
  # Откатываемся на стабильный стек, чтобы не ловить конфликты SDK
  flutter_riverpod: ^2.6.1 
  riverpod_annotation: ^2.3.6
  injectable: ^2.7.1
  dio: ^5.7.0
  retrofit: '>=4.6.0 <4.9.0'
  intl: ^0.20.2 # Стабильная версия для текущих SDK
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  epub_engine:
    path: packages/epub_engine
  pdf_engine:
    path: packages/pdf_engine
  
  # БД
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.3
  file_selector: ^1.1.0
  file_selector_linux: ^0.9.4
  file_selector_android: ^0.5.2+4
  file_selector_ios: ^0.5.3+4
  file_selector_macos: ^0.9.5
  file_selector_windows: ^0.9.3+5
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Генераторы (оставляем стабильные)
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  injectable_generator: ^2.6.1
  retrofit_generator: 9.7.0
  # Линтеры временно удалены из-за конфликта (analyzer_plugin)

flutter:
  generate: true
  uses-material-design: true